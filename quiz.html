  },
  {
    text: "Five years from now. What's the version of your practice that genuinely excites you?",
    sub: "What's the answer that actually get's you feeling something?!",
    options: [
      { text: "A full client roster, a local reputation & a practice that's rooted in your local community", em: "", weights: {"clinic":5,"vet":3} },
      { text: "Fully remote: clients everywhere, working from wherever I want", em: "", weights: {"virtual":5,"education":2,"hybrid":2} },
      { text: "A recognized name in homeopathy education: courses, a community, practitioners I've helped mentor out in the world", em: "", weights: {"educator":5,"education":4,"hybrid":2} },
      { text: "A multi-stream practice that's entirely mine: clients, products, content & community all in alignment", em: "", weights: {"hybrid":6,"education":2,"virtual":2} },
      { text: "Deep in a niche. Animals, plants, or acute care. The person people find when nothing else has worked", em: "", weights: {"vet":4,"agro":4,"acute":4} }
    ]
  }
];
const RANK_LABELS=[
"Your strongest alignment", "Also a strong fit", "Worth exploring"
];
var introTitle="Find Your Practice Alignment";
var introBody="There's no one right way to run a practice. I think that's what we all love about homeopathy! This quiz cuts through the noise & gently guides you toward the version of practice that's actually built for how you're wired. This isn't an end-all-be-all, just a clearer picture of where your energy, instincts & strengths naturally trend. Answer from your gut & as the person you are right now! Have fun :) ";
var introBtn="Let's find out →";
var resultsTitle="Your Practice Alignment";
var resultsSub="Here's where your energy, instincts & strengths naturally point. This is not a definitive answer, it's simply a tool for gaining perspective on where your strengths lay & what kind of practice may be most sustainable & fitting for your unique energy. Use it as a starting place & build from there! Feel free to re-visit it at any point :) ";
var calcText="Model what these practice types could generate →";
var retakeText="← Start over";
let currentQ=-1;let answers={};
function getScores(){var s={};Object.keys(OUTCOMES).forEach(function(k){s[k]=0;});Object.entries(answers).forEach(function(e){var qi=e[0],oi=e[1];var w=QUESTIONS[parseInt(qi)].options[oi].weights;Object.entries(w).forEach(function(f){s[f[0]]=(s[f[0]]||0)+f[1];});});return s;}
function getTopResults(n){n=n||3;var s=getScores();var t=Object.values(s).reduce(function(a,b){return a+b;},0)||1;return Object.entries(s).sort(function(a,b){return b[1]-a[1];}).slice(0,n).map(function(e){return{key:e[0],score:e[1],pct:Math.round((e[1]/t)*100)};});}
function render(){
  var app=document.getElementById("app");
  if(currentQ===-1){
    var it=introTitle.replace("Alignment","<span>Alignment</span>");
    app.innerHTML='<div class="intro-card"><div class="intro-eyebrow">Practitioner Blueprint</div><div class="intro-title">'+it+'</div><p class="intro-body">'+introBody+'</p><button class="btn-start" onclick="startQuiz()">'+introBtn+'</button><p class="intro-meta">'+QUESTIONS.length+' questions &nbsp;&middot;&nbsp; About 4 minutes</p></div>';
    return;
  }
  if(currentQ>=QUESTIONS.length){renderResults();return;}
  var q=QUESTIONS[currentQ];
  var pct=Math.round((currentQ/QUESTIONS.length)*100);
  var sel=answers[currentQ];
  var opts=q.options.map(function(o,i){
    return '<button class="option-btn '+( sel===i?"selected":"")+'" onclick="selectOption('+i+')"><div class="option-dot"><div class="option-dot-inner"></div></div><div class="option-text">'+o.text+(o.em?'<em>'+o.em+'</em>':'')+'</div></button>';
  }).join("");
  app.innerHTML='<div class="progress-wrap"><div class="progress-meta"><span>Question '+( currentQ+1)+' of '+QUESTIONS.length+'</span><span>'+pct+'% complete</span></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div><div class="question-card"><div class="q-number">Question '+( currentQ+1)+'</div><div class="q-text">'+q.text+'</div>'+( q.sub?'<div class="q-sub">'+q.sub+'</div>':'')+'<div class="options-list">'+opts+'</div></div><div class="nav-row"><button class="btn-back" onclick="goBack()" '+( currentQ===0?'style="visibility:hidden"':'')+'>&#8592; Back</button><button class="btn-next '+( sel!==undefined?"enabled":"")+'" onclick="goNext()">'+( currentQ===QUESTIONS.length-1?'See my results &#8594;':'Next &#8594;')+'</button></div>';
}
function renderResults(){
  var top=getTopResults(3);
  var app=document.getElementById("app");
  var cards=top.map(function(r,i){
    var o=OUTCOMES[r.key];
    var isPrimary=i===0;
    var strs=o.strengths.map(function(s){return'<span class="strength-tag">'+s+'</span>';}).join("");
    return '<div class="result-card '+( isPrimary?"primary":"")+'"><div class="result-rank '+( isPrimary?"":"secondary")+'">'+( RANK_LABELS[i]||"")+'</div><div class="result-name">'+o.name+'</div><div class="result-tagline">'+o.tagline+'</div><div class="match-bar-wrap"><div class="match-bar-label"><span>Alignment match</span><span class="match-pct">'+r.pct+'%</span></div><div class="match-track"><div class="match-fill" style="width:'+r.pct+'%"></div></div></div><div class="result-body">'+o.body+'</div><div class="result-strengths">'+strs+'</div></div>';
  }).join("");
  app.innerHTML='<div class="results-wrap"><div class="results-header"><div class="results-eyebrow">Your results</div><div class="results-title">'+resultsTitle+'</div><p class="results-sub">'+resultsSub+'</p></div>'+cards+'<button class="retake-btn" onclick="retake()">'+retakeText+'</button><a class="calc-link" href="https://harenholistics-commits.github.io/homeopathy_business_model_calculator" target="_blank">'+calcText+'</a></div>';
}
function startQuiz(){currentQ=0;render();}
function selectOption(i){answers[currentQ]=i;render();}
function goNext(){if(answers[currentQ]!==undefined){currentQ++;render();window.scrollTo({top:0,behavior:"smooth"});}}
function goBack(){if(currentQ>0){currentQ--;render();window.scrollTo({top:0,behavior:"smooth"});}}
function retake(){currentQ=-1;answers={};render();window.scrollTo({top:0,behavior:"smooth"});}
render();
</script>
</body>
</html>
