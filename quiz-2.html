      { text: "Fully remote: clients everywhere, working from wherever I want", em: "", weights: {"virtual":5,"education":2,"hybrid":2} },
      { text: "A recognized name in homeopathy education: courses, a community, practitioners I've trained out in the world", em: "", weights: {"educator":5,"education":4,"hybrid":2} },
      { text: "A multi-stream practice that's entirely mine: clients, products, content & community all in alignment", em: "", weights: {"hybrid":6,"education":2,"virtual":2} },
      { text: "Deep in a niche. Animals, plants, or acute care. The person people find when nothing else has worked", em: "", weights: {"vet":4,"agro":4,"acute":4} }
    ]
  }
];
const RANK_LABELS = ["Your strongest alignment", "Also a strong fit", "Worth exploring"];
let currentQ = -1;
let answers = {};
function getScores(){const s={};Object.keys(OUTCOMES).forEach(k=>s[k]=0);Object.entries(answers).forEach(([qi,oi])=>{const w=QUESTIONS[parseInt(qi)].options[oi].weights;Object.entries(w).forEach(([k,v])=>{s[k]=(s[k]||0)+v;});});return s;}
function getTopResults(n=3){const s=getScores();const t=Object.values(s).reduce((a,b)=>a+b,0)||1;return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([key,score])=>({key,score,pct:Math.round((score/t)*100)}));}
function fmt(n){return'$'+Math.round(n).toLocaleString();}
function render(){
  const app=document.getElementById('app');
  if(currentQ===-1){
    app.innerHTML=`<div class="intro-card"><div class="intro-eyebrow">Practitioner Blueprint</div><div class="intro-title">Find Your Practice <span>Alignment</span></div><p class="intro-body">There's no one right way to build this. Anyone who tells you otherwise is selling a template. This quiz cuts through the noise & points you toward the version of practice that's actually built for how you're wired. No fluff. No generic advice. Just a clearer picture of where your energy, instincts & strengths naturally want to go. Answer from your gut. Your first instinct is usually the honest one.</p><button class="btn-start" onclick="startQuiz()">Let's find out →</button><p class="intro-meta">${QUESTIONS.length} questions &nbsp;&middot;&nbsp; About 4 minutes</p></div>`;
    return;
  }
  if(currentQ>=QUESTIONS.length){renderResults();return;}
  const q=QUESTIONS[currentQ];
  const pct=Math.round((currentQ/QUESTIONS.length)*100);
  const sel=answers[currentQ];
  app.innerHTML=`<div class="progress-wrap"><div class="progress-meta"><span>Question ${currentQ+1} of ${QUESTIONS.length}</span><span>${pct}% complete</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="question-card"><div class="q-number">Question ${currentQ+1}</div><div class="q-text">${q.text}</div>${q.sub?`<div class="q-sub">${q.sub}</div>`:''}<div class="options-list">${q.options.map((o,i)=>`<button class="option-btn ${sel===i?'selected':''}" onclick="selectOption(${i})"><div class="option-dot"><div class="option-dot-inner"></div></div><div class="option-text">${o.text}${o.em?`<em>${o.em}</em>`:''}</div></button>`).join('')}</div></div><div class="nav-row"><button class="btn-back" onclick="goBack()" ${currentQ===0?'style="visibility:hidden"':''}>← Back</button><button class="btn-next ${sel!==undefined?'enabled':''}" onclick="goNext()">${currentQ===QUESTIONS.length-1?'See my results →':'Next →'}</button></div>`;
}
function renderResults(){
  const top=getTopResults(3);
  const app=document.getElementById('app');
  const cards=top.map((r,i)=>{const o=OUTCOMES[r.key];const isPrimary=i===0;return`<div class="result-card ${isPrimary?'primary':''}"><div class="result-rank ${isPrimary?'':'secondary'}">${RANK_LABELS[i]||''}</div><div class="result-name">${o.name}</div><div class="result-tagline">${o.tagline}</div><div class="match-bar-wrap"><div class="match-bar-label"><span>Alignment match</span><span class="match-pct">${r.pct}%</span></div><div class="match-track"><div class="match-fill" style="width:${r.pct}%"></div></div></div><div class="result-body">${o.body}</div><div class="result-strengths">${o.strengths.map(s=>`<span class="strength-tag">${s}</span>`).join('')}</div></div>`;}).join('');
  app.innerHTML=`<div class="results-wrap"><div class="results-header"><div class="results-eyebrow">Your results</div><div class="results-title">Your Practice Alignment</div><p class="results-sub">Here's where your energy, instincts & strengths naturally point. This is not a prescription. It's a mirror. Use it as a starting place & build from there. The pattern knows.</p></div>${cards}<button class="retake-btn" onclick="retake()">← Start over</button><a class="calc-link" href="https://harenholistics-commits.github.io/homeopathy_business_model_calculator" target="_blank">Model what these practice types could generate →</a></div>`;
}
function startQuiz(){currentQ=0;render();}
function selectOption(i){answers[currentQ]=i;render();}
function goNext(){if(answers[currentQ]!==undefined){currentQ++;render();window.scrollTo({top:0,behavior:'smooth'});}}
function goBack(){if(currentQ>0){currentQ--;render();window.scrollTo({top:0,behavior:'smooth'});}}
function retake(){currentQ=-1;answers={};render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
</body>
</html>
